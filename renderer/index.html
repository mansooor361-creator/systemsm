<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http:; frame-src https: http:; script-src 'self'" />
  <title>DaAIx</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="theme-dark" dir="rtl">

  <header id="topbar">
    <div class="brand">
      <button id="btnKbPicker" class="tb-btn mono kb-db-btn" data-i18n-title="kbPickerTitle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.66 3.58 3 8 3s8-1.34 8-3v-13"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg></button>
    </div>
    <input id="globalSearch" type="search" data-i18n-ph="search" autocomplete="off" />
    <button id="btnSearchMode" class="tb-btn mono" data-i18n-title="searchModeTitle"></button>
    <div id="searchModeMenu" class="kb-menu search-mode-menu hidden"></div>
    <div id="kbPickerMenu" class="kb-menu kb-picker hidden"></div>
  </header>

  <div id="tabBar" class="tab-bar hidden"></div>

  <div id="layout">
    <nav id="rail">
      <button id="btnRailHome" class="rail-btn rail-home" data-i18n-title="home">⌂</button>
      <div id="toolRail" class="tool-rail"></div>
      <div class="rail-sep"></div>
      <button id="btnAgents" class="tb-btn rail-btn mono" data-i18n-title="agents">✨</button>
      <button id="btnNotes" class="tb-btn rail-btn mono" data-i18n-title="notes">⎘</button>
      <button id="btnDrawer" class="tb-btn rail-btn" title="⚙️">⚙️</button>
    </nav>

    <main id="main">
      <!-- Home -->
      <section id="view-home" class="view">
        <div id="homeLauncher" class="home-launcher">
          <div class="home-sec" data-i18n="homeTools"></div>
          <div id="homeTools" class="home-tools"></div>
          <div class="home-sec" data-i18n="homeRecent"></div>
          <div id="homeRecent" class="home-recent"></div>
        </div>
        <div id="searchResults" class="search-results"></div>
        <div class="feed-head" id="feedHead">
          <h2 class="feed-title" id="feedTitle" data-i18n="latestUpdates"></h2>
          <button id="btnFeedView" class="tb-btn mono" data-i18n-title="feedListView">☰</button>
        </div>
        <div id="updatesFeed" class="updates-feed"></div>
      </section>

      <!-- Document reader: TOC | center tabs | right tabbed panel -->
      <section id="view-doc" class="view hidden">
        <aside id="docToc" class="doc-toc">
          <div class="toc-head">
            <h3 data-i18n="toc"></h3>
            <button id="btnTocCollapse" class="toc-collapse mono" title="">⌄</button>
          </div>
          <div id="tocItems"></div>
        </aside>
        <div id="tocSplit" class="col-split col-split-toc mono" data-i18n-title="colResize"></div>
        <button id="btnTocToggle" class="toc-toggle" data-i18n-title="tocHide">❮</button>
        <div id="docCenter" class="doc-center">
          <div class="center-tabs" id="centerTabs">
            <button class="ctab active" data-tab="props" data-i18n="tabProps"></button>
            <button class="ctab" data-tab="original" data-i18n="tabOriginal"></button>
            <button class="ctab" data-tab="pub" data-i18n="tabPublication"></button>
            <button id="btnEditDoc" class="ctab-edit mono" title="">⊘</button>
          </div>
          <div id="editBanner" class="edit-banner hidden">
            <span id="editWarningText"></span>
            <div class="edit-banner-actions">
              <button id="btnSaveEdits" class="primary">💾 <span data-i18n="saveEdits"></span></button>
              <button id="btnDiscardEdits" class="danger" data-i18n="discardEdits"></button>
            </div>
          </div>
          <div id="paneProps" class="center-pane">
            <div id="docPaper" class="doc-paper">
              <div id="docHeader"></div>
              <div id="docBody"></div>
            </div>
          </div>
          <div id="paneOriginal" class="center-pane hidden">
            <div class="doc-paper">
              <div id="originalNote" class="hint pane-note"></div>
              <div id="docOriginal"></div>
            </div>
          </div>
          <div id="panePub" class="center-pane hidden">
            <div class="doc-paper">
              <div id="docPublication"></div>
            </div>
          </div>
          <div id="docStats" class="doc-stats"></div>
        </div>
        <div id="propsSplit" class="col-split col-split-props mono" data-i18n-title="colResize"></div>
        <button id="btnPropsToggle" class="toc-toggle props-toggle mono" data-i18n-title="propsHide">❯</button>
        <aside id="docProps" class="doc-props">
          <div class="right-tabs" id="rightTabs">
            <button class="rtab mono active" data-tab="amend" data-i18n-title="rightAmend" title="سجل التعديلات">🕒</button>
            <button class="rtab mono" data-tab="rulings" data-i18n-title="rightRulings" title="الأحكام المرتبطة">🔨</button>
            <button class="rtab mono" data-tab="relations" data-i18n-title="rightRelations" title="الارتباطات">🔗</button>
            <button class="rtab mono" data-tab="chat" data-i18n-title="rightChat" title="شات جي بي تي">💬</button>
          </div>
          <div id="rpaneAmend" class="right-pane">
            <div class="sub-tabs">
              <button class="stab active" data-sub="versions" data-i18n="subVersions"></button>
              <button class="stab" data-sub="amends" data-i18n="subAmendments"></button>
            </div>
            <div id="rpVersions"></div>
            <div id="rpAmends" class="hidden"></div>
          </div>
          <div id="rpaneRulings" class="right-pane hidden"></div>
          <div id="rpaneRelations" class="right-pane hidden"></div>
          <div id="rpaneChat" class="right-pane hidden">
            <div class="rpane-chat-head">
              <button id="docChatExpand" class="tb-btn mono" data-i18n-title="docChatExpand">⤢</button>
            </div>
            <div id="docChatLog" class="chat-log doc-chat-log"></div>
            <div class="chat-input-row doc-chat-input-row">
              <textarea id="docChatInput" rows="2" data-i18n-ph="chatPlaceholder"></textarea>
              <button id="docChatSend" class="primary">↑</button>
            </div>
          </div>
        </aside>
      </section>

      <!-- Agents -->
      <section id="view-agents" class="view hidden">
        <div id="agentWorkspace" class="agent-workspace"></div>
      </section>

      <!-- Tools -->
      <section id="view-tools" class="view hidden">
        <div id="toolsMenu" class="tools-menu"></div>
        <div id="toolPanel" class="tool-panel"></div>
      </section>

      <!-- Notes -->
      <section id="view-notes" class="view hidden">
        <div class="notes-head">
          <h2 data-i18n="notes"></h2>
          <button id="btnNewNote" class="primary" data-i18n="newNote"></button>
        </div>
        <div id="notesList" class="notes-list"></div>
        <div id="noteEditor" class="note-editor hidden">
          <textarea id="noteText" data-i18n-ph="notesPlaceholder"></textarea>
          <div class="note-actions">
            <button id="btnSaveNote" class="primary" data-i18n="saveNote"></button>
            <button id="btnDeleteNote" class="danger" data-i18n="delete"></button>
          </div>
        </div>
      </section>

      <!-- Settings -->
      <section id="view-settings" class="view hidden">
        <h2 data-i18n="settings"></h2>
        <div class="set-tabs" id="setTabs">
          <button class="set-tab active" data-set="settings" data-i18n="setTabSettings"></button>
          <button class="set-tab" data-set="kbs" data-i18n="setTabKbs"></button>
          <button class="set-tab" data-set="tools" data-i18n="setTabTools"></button>
          <button class="set-tab" data-set="ai" data-i18n="setTabAi"></button>
        </div>
        <div id="setPaneSettings" class="set-pane">
        <!-- v1.6.28: general settings restyled as agents-style cards (same .set-card language as the AI/agents window; no IDs or behavior changed) -->
        <div class="settings-cards set-cards-settings">
          <div class="set-card">
            <div class="sc-head"><span class="sr-icon mono">◐</span><div class="sr-main"><div class="sr-name" data-i18n="appearance"></div></div></div>
            <div class="sc-foot factory-foot">
              <button id="btnFactoryReset" class="ghost-btn" data-i18n="factoryReset"></button>
            </div>
            <label><span data-i18n="language"></span>
              <select id="setLang"><option value="ar">العربية</option><option value="en">English</option></select>
            </label>
            <label><span data-i18n="theme"></span>
              <select id="setTheme"><option value="dark" data-i18n="dark"></option><option value="light" data-i18n="light"></option></select>
            </label>
            <label><span data-i18n="fontFam"></span>
              <input id="setFontFam" list="fontFamList" placeholder="Segoe UI / Tahoma…" />
              <datalist id="fontFamList">
                <option value="Segoe UI"></option>
                <option value="Tahoma"></option>
                <option value="Noto Naskh Arabic"></option>
                <option value="Cairo"></option>
                <option value="Amiri"></option>
                <option value="Traditional Arabic"></option>
                <option value="Sakkal Majalla"></option>
                <option value="Georgia"></option>
              </datalist>
            </label>
            <label><span data-i18n="fontSizeUi"></span>
              <input id="setFontSize" type="number" min="12" max="22" step="1" value="16" />
            </label>
            <label><span data-i18n="fontColorHis"></span>
              <input id="setFontColor" type="color" value="#e6edf7" />
            </label>
            <div class="sc-foot">
              <button id="btnFontResetHis" class="ghost-btn" data-i18n="fontReset"></button>
            </div>
          </div>
          <div class="set-card">
            <div class="sc-head"><span class="sr-icon mono">#</span><div class="sr-main"><div class="sr-name" data-i18n="readStyle"></div></div></div>
            <p class="hint"><span data-i18n="readStyleHint"></span></p>
            <div class="typo-table">
            <div class="tt-row tt-head">
              <span data-i18n="typoLvl"></span><span data-i18n="typoFont"></span><span data-i18n="typoSize"></span><span data-i18n="typoColor"></span><span data-i18n="typoBg"></span>
            </div>
            <div class="tt-row"><span class="mono">#</span>
              <input id="setHFont1" type="text" list="fontFamList" />
              <input id="setHSize1" type="number" min="10" max="48" />
              <span class="tt-pair"><input id="setHFg1" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setHFg1c" type="color" /></span>
              <span class="tt-pair"><input id="setHBg1" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setHBg1c" type="color" /></span>
            </div>
            <div class="tt-row"><span class="mono">##</span>
              <input id="setHFont2" type="text" list="fontFamList" />
              <input id="setHSize2" type="number" min="10" max="48" />
              <span class="tt-pair"><input id="setHFg2" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setHFg2c" type="color" /></span>
              <span class="tt-pair"><input id="setHBg2" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setHBg2c" type="color" /></span>
            </div>
            <div class="tt-row"><span class="mono">###</span>
              <input id="setHFont3" type="text" list="fontFamList" />
              <input id="setHSize3" type="number" min="10" max="48" />
              <span class="tt-pair"><input id="setHFg3" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setHFg3c" type="color" /></span>
              <span class="tt-pair"><input id="setHBg3" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setHBg3c" type="color" /></span>
            </div>
            <div class="tt-row"><span class="mono">####</span>
              <input id="setHFont4" type="text" list="fontFamList" />
              <input id="setHSize4" type="number" min="10" max="48" />
              <span class="tt-pair"><input id="setHFg4" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setHFg4c" type="color" /></span>
              <span class="tt-pair"><input id="setHBg4" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setHBg4c" type="color" /></span>
            </div>
            <div class="tt-row"><span class="mono">#####</span>
              <input id="setHFont5" type="text" list="fontFamList" />
              <input id="setHSize5" type="number" min="10" max="48" />
              <span class="tt-pair"><input id="setHFg5" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setHFg5c" type="color" /></span>
              <span class="tt-pair"><input id="setHBg5" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setHBg5c" type="color" /></span>
            </div>
            <div class="tt-row"><span class="mono">######</span>
              <input id="setHFont6" type="text" list="fontFamList" />
              <input id="setHSize6" type="number" min="10" max="48" />
              <span class="tt-pair"><input id="setHFg6" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setHFg6c" type="color" /></span>
              <span class="tt-pair"><input id="setHBg6" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setHBg6c" type="color" /></span>
            </div>
            </div>
            <div class="typo-table">
              <div class="tt-title" data-i18n="typoContent"></div>
            <div class="tt-row tt-head">
              <span data-i18n="typoLvl"></span><span data-i18n="typoFont"></span><span data-i18n="typoSize"></span><span data-i18n="typoColor"></span><span data-i18n="typoBg"></span>
            </div>
            <div class="tt-row"><span class="mono">#</span><span class="tt-under" data-i18n="typoUnder"></span>
              <input id="setSecFont1" type="text" list="fontFamList" />
              <input id="setSecSize1" type="number" min="10" max="40" />
              <span class="tt-pair"><input id="setSecFg1" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setSecFg1c" type="color" /></span>
              <span class="tt-pair"><input id="setSecBg1" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setSecBg1c" type="color" /></span>
            </div>
            <div class="tt-row"><span class="mono">##</span><span class="tt-under" data-i18n="typoUnder"></span>
              <input id="setSecFont2" type="text" list="fontFamList" />
              <input id="setSecSize2" type="number" min="10" max="40" />
              <span class="tt-pair"><input id="setSecFg2" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setSecFg2c" type="color" /></span>
              <span class="tt-pair"><input id="setSecBg2" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setSecBg2c" type="color" /></span>
            </div>
            <div class="tt-row"><span class="mono">###</span><span class="tt-under" data-i18n="typoUnder"></span>
              <input id="setSecFont3" type="text" list="fontFamList" />
              <input id="setSecSize3" type="number" min="10" max="40" />
              <span class="tt-pair"><input id="setSecFg3" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setSecFg3c" type="color" /></span>
              <span class="tt-pair"><input id="setSecBg3" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setSecBg3c" type="color" /></span>
            </div>
            <div class="tt-row"><span class="mono">####</span><span class="tt-under" data-i18n="typoUnder"></span>
              <input id="setSecFont4" type="text" list="fontFamList" />
              <input id="setSecSize4" type="number" min="10" max="40" />
              <span class="tt-pair"><input id="setSecFg4" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setSecFg4c" type="color" /></span>
              <span class="tt-pair"><input id="setSecBg4" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setSecBg4c" type="color" /></span>
            </div>
            <div class="tt-row"><span class="mono">#####</span><span class="tt-under" data-i18n="typoUnder"></span>
              <input id="setSecFont5" type="text" list="fontFamList" />
              <input id="setSecSize5" type="number" min="10" max="40" />
              <span class="tt-pair"><input id="setSecFg5" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setSecFg5c" type="color" /></span>
              <span class="tt-pair"><input id="setSecBg5" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setSecBg5c" type="color" /></span>
            </div>
            <div class="tt-row"><span class="mono">######</span><span class="tt-under" data-i18n="typoUnder"></span>
              <input id="setSecFont6" type="text" list="fontFamList" />
              <input id="setSecSize6" type="number" min="10" max="40" />
              <span class="tt-pair"><input id="setSecFg6" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setSecFg6c" type="color" /></span>
              <span class="tt-pair"><input id="setSecBg6" type="text" class="hbg-hex" placeholder="#ffffff" /><input id="setSecBg6c" type="color" /></span>
            </div>
            </div>
            <div class="hbg-grid">
              <label class="hbg-row"><span data-i18n="paperBg"></span>
                <input id="setPaperBgT" class="hbg-hex" type="text" placeholder="#ffffff" />
                <input id="setPaperBgC" type="color" />
              </label>
            </div>
            <div class="sc-foot">
              <button id="btnReadStyleReset" class="ghost-btn" data-i18n="fontReset"></button>
            </div>
          </div>
          <div class="set-card">
            <div class="sc-head"><span class="sr-icon mono">⟳</span><div class="sr-main"><div class="sr-name" data-i18n="checkUpdates"></div></div></div>
            <label><span data-i18n="updateUrl"></span>
              <input id="setUpdateUrl" type="url" />
            </label>
            <div class="sc-foot">
              <span id="updateStatus" class="update-status"></span>
              <button id="btnCheckUpdates" class="primary" data-i18n="checkUpdates"></button>
            </div>
          </div>
        </div>
        </div>
        <div id="setPaneKbs" class="set-pane hidden">
          <p class="hint" data-i18n="kbPaneHint"></p>
          <div class="kb-add-row">
            <button id="btnKbSourceFolder" class="primary" data-i18n="srcFolder"></button>
            <button id="btnKbSourceCloud" class="primary" data-i18n="srcCloud"></button>
            <button id="btnKbSourcePlatform" class="primary" data-i18n="srcPlatform"></button>
            <span id="kbAddStatus" class="update-status"></span>
          </div>
          <div id="kbCloudPanel" class="kb-cloud-panel hidden"></div>
          <div id="kbPlatformPanel" class="kb-platform-panel hidden">
            <input id="setKbApiUrl" type="url" data-i18n-ph="kbApiPh" value="https://smartk-ai.com" />
            <input id="setKbApiKey" type="password" data-i18n-ph="platformKey" autocomplete="off" />
            <button id="btnKbAddApi" class="primary" data-i18n="platformConnect"></button>
          </div>
          <div id="kbProgress" class="kb-progress hidden">
            <div class="kb-progress-head"><span id="kbProgressStage"></span><span id="kbProgressPct"></span></div>
            <div class="kb-progress-track"><div id="kbProgressBarFill"></div></div>
            <div id="kbProgressFile" class="hint"></div>
          </div>
          <div id="kbSettingsList" class="settings-cards"></div>
        </div>
        <div id="setPaneTools" class="set-pane hidden">
          <p class="hint" data-i18n="toolsPaneHint"></p>
          <input id="setToolSearch" type="search" class="tools-search" data-i18n-ph="toolsSearchPh" />
          <div id="toolSettingsList" class="settings-cards"></div>
        </div>
        <!-- v1.6.39: the Agents pane is now two side-by-side windows (agents+models / skills) with the external connectors window below -->
        <div id="setPaneAi" class="set-pane hidden">
          <p class="hint" data-i18n="aiPaneHint"></p>
          <div class="ai-grid">
            <div class="set-card ai-col">
              <div class="sc-head"><span class="sr-icon mono">◈</span><div class="sr-main"><div class="sr-name" data-i18n="agentsWin"></div></div></div>
              <div class="wide sep" data-i18n="providersTitle"></div>
              <p class="hint" data-i18n="providerHint"></p>
              <div id="providerList" class="settings-rows"></div>
              <div class="wide sep" data-i18n="llmApi"></div>
              <div class="settings-grid">
                <label><span data-i18n="baseUrl"></span><input id="setLlmUrl" type="url" placeholder="https://api.openai.com/v1" /></label>
                <label><span data-i18n="apiKey"></span><input id="setLlmKey" type="password" autocomplete="off" /></label>
                <label><span data-i18n="model"></span><input id="setLlmModel" type="text" list="modelPresets" placeholder="gpt-4o-mini" /></label>
              </div>
              <datalist id="modelPresets">
                <option value="gpt-4o-mini"></option>
                <option value="gpt-4o"></option>
                <option value="claude-sonnet-4"></option>
                <option value="gemini-2.0-flash"></option>
                <option value="mistral-large-latest"></option>
              </datalist>
              <p class="hint" data-i18n="llmHint"></p>
              <div class="wide sep" data-i18n="memoryTitle"></div>
              <div id="memoryList" class="cmd-list"></div>
              <div class="sc-foot">
                <button id="btnAiSave" class="primary" data-i18n="save"></button>
              </div>
            </div>
            <div class="set-card ai-col">
              <div class="sc-head"><span class="sr-icon mono">✦</span><div class="sr-main"><div class="sr-name" data-i18n="skillsWin"></div></div></div>
              <div class="wide sep" data-i18n="customSkillsTitle"></div>
              <div id="customSkillBuilder"></div>
              <div id="customSkillList" class="cmd-list"></div>
              <div class="wide sep" data-i18n="aiSkillsTitle"></div>
              <div id="skillList" class="cmd-list"></div>
            </div>
            <div class="set-card ai-col ai-connectors">
              <div class="sc-head"><span class="sr-icon mono">⇄</span><div class="sr-main"><div class="sr-name" data-i18n="connectorsTitle"></div></div></div>
              <div id="connectorList"></div>
              <div class="sc-foot">
                <button id="btnAddConnector" class="primary" data-i18n="addConnector"></button>
                <button id="btnSaveSettings" class="primary" data-i18n="save"></button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Right settings drawer -->
  <div id="drawerOverlay" class="drawer-overlay hidden"></div>
  <aside id="drawer" class="drawer hidden">
    <div class="drawer-head">
      <h3 data-i18n="settings"></h3>
      <button id="btnDrawerClose" class="tb-btn">✕</button>
    </div>
    <div class="drawer-body">
      <div class="drawer-section">
        <h4 data-i18n="account"></h4>
        <p class="hint" data-i18n="accountHint"></p>
        <div id="accountArea" class="account-area"></div>
      </div>
      <div class="drawer-section">
        <h4 data-i18n="appearance"></h4>
        <label><span data-i18n="language"></span>
          <select id="drawerLang"><option value="ar">العربية</option><option value="en">English</option></select>
        </label>

<script>
(function () {
  function show(msg) {
    var el = document.getElementById('bootError');
    if (!el) {
      el = document.createElement('div');
      el.id = 'bootError';
      el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#1b1b1b;color:#e8e8e8;font:12px/1.6 Consolas,monospace;padding:10px 14px;white-space:pre-wrap;direction:ltr;text-align:left;border-bottom:1px solid #444;';
      (document.body || document.documentElement).appendChild(el);
    }
    el.textContent += (el.textContent ? '\n' : '') + msg;
  }
  window.addEventListener('error', function (e) { show('ERROR: ' + (e.message || (e.error && e.error.stack) || 'unknown') + (e.filename ? '\n  at ' + e.filename + ':' + e.lineno : '')); });
  window.addEventListener('unhandledrejection', function (e) { show('REJECTION: ' + ((e.reason && (e.reason.stack || e.reason.message)) || String(e.reason))); });
})();
</script>
